<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Security</title>

<style>
html,body {
    margin:0;
    width:100%;
    height:100%;
    background:black;
    color:#00ff00;
    font-family:monospace;
    overflow:hidden;
}

#screen {
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
}

#scan {
    font-size:22px;
}

#shutdown {
    display:none;
    color:white;
    font-family:Arial,sans-serif;
    font-size:28px;
}

.spinner {
    margin:25px auto;
    width:35px;
    height:35px;
    border:4px solid #555;
    border-top:4px solid white;
    border-radius:50%;
    animation:spin 1s linear infinite;
}

@keyframes spin {
    to { transform:rotate(360deg); }
}
</style>
</head>

<body>

<div id="screen">

<div id="scan">
<h2>⚠ SYSTEM SECURITY ⚠</h2>
<p id="text">Scanning device...</p>
<p id="percent">0%</p>
</div>

<div id="shutdown">
<p>Shutting down...</p>
<div class="spinner"></div>
</div>

</div>

<script>
let percent = 0;

let scan = setInterval(function() {

percent++;

document.getElementById("percent").textContent =
percent + "%";

if (percent === 35) {
document.getElementById("text").textContent =
"Threat detected...";
}

if (percent === 65) {
document.getElementById("text").textContent =
"Removing threat...";
}

if (percent >= 100) {

clearInterval(scan);

document.getElementById("scan").style.display = "none";
document.getElementById("shutdown").style.display = "block";

}

}, 80);
</script>

</body>
</html>
